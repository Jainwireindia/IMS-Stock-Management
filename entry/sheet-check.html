<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>IMS Sheet Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: collapsible deep-teal sidebar + card report on a faint weldmesh grid (IMS "Look v2") */
:root{
  --teal:#2A9D95; --teal-deep:#1d7a73; --teal-soft:#d3ebe8; --on-teal:#ffffff; --yellow:#e3a613;
  --bg:#e2eeec; --mesh:rgba(42,157,149,.09); --glow:rgba(255,255,255,.75);
  --card:#ffffff; --card-2:#f4f9f8; --ink:#0b191d; --muted:#4f666a; --faint:#7d9295; --line:#d2e2df;
  --side:#0d2f2d; --side-mesh:rgba(227,166,19,.07); --side-ink:#dcefed; --side-muted:#8db7b2; --side-hover:rgba(255,255,255,.07); --side-active:rgba(42,157,149,.35);
  --red:#bf3a32; --red-bg:#fbe8e6; --amber:#9a6406; --amber-bg:#fcf1d8; --green:#1f7d52; --green-bg:#e0f3e8; --slate:#4d6870; --slate-bg:#e6eef0; --blue:#2b6cb0; --blue-bg:#e3eefb;
  --shadow:0 1px 2px rgba(11,25,29,.06),0 6px 20px rgba(11,25,29,.05);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --teal-soft:#123a37; --bg:#081214; --mesh:rgba(42,157,149,.07); --glow:rgba(42,157,149,.10);
  --card:#0f1c1f; --card-2:#132428; --ink:#edf5f4; --muted:#9ab3b4; --faint:#6f8a8c; --line:#1f3539;
  --side:#040c0e; --side-ink:#d6eae8; --side-muted:#7aa29e;
  --red:#ff8a80; --red-bg:#3a1916; --amber:#f2c063; --amber-bg:#352710; --green:#6fd6a0; --green-bg:#12301f; --slate:#a9c0c5; --slate-bg:#1a2b2f; --blue:#8cbcf5; --blue-bg:#14263b;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --teal-soft:#123a37; --bg:#081214; --mesh:rgba(42,157,149,.07); --glow:rgba(42,157,149,.10);
  --card:#0f1c1f; --card-2:#132428; --ink:#edf5f4; --muted:#9ab3b4; --faint:#6f8a8c; --line:#1f3539;
  --side:#040c0e; --side-ink:#d6eae8; --side-muted:#7aa29e;
  --red:#ff8a80; --red-bg:#3a1916; --amber:#f2c063; --amber-bg:#352710; --green:#6fd6a0; --green-bg:#12301f; --slate:#a9c0c5; --slate-bg:#1a2b2f; --blue:#8cbcf5; --blue-bg:#14263b;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:14.5px;font-weight:500;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(ellipse 80% 40% at 50% -10%,var(--glow),transparent 70%),
  linear-gradient(var(--mesh) 1px,transparent 1px),linear-gradient(90deg,var(--mesh) 1px,transparent 1px);
  background-size:auto,30px 30px,30px 30px;background-attachment:fixed;line-height:1.5;font-variant-numeric:tabular-nums;font-variant-ligatures:no-contextual;font-feature-settings:"calt" 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.app.collapsed{grid-template-columns:74px minmax(0,1fr)}
/* sidebar */
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:18px;
  padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));
  background-image:linear-gradient(var(--side-mesh) 1px,transparent 1px),linear-gradient(90deg,var(--side-mesh) 1px,transparent 1px);background-size:30px 30px;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--teal);flex:none;position:relative;overflow:hidden;
  background-image:linear-gradient(rgba(227,166,19,.95) 2px,transparent 2px),linear-gradient(90deg,rgba(227,166,19,.95) 2px,transparent 2px);background-size:9px 9px;background-position:3px 3px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.brand b{font-size:16px;font-weight:800;letter-spacing:-.01em;display:block;line-height:1.15}
.brand small{color:var(--side-muted);font-size:11.5px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{all:unset;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--side-ink);font-weight:600;font-size:14px;cursor:pointer}
.nav button:hover{background:var(--side-hover)}
.nav button.on{background:var(--side-active);color:#fff}
.nav button:focus-visible{outline:2px solid var(--teal)}
.nav svg{width:19px;height:19px;flex:none;opacity:.9}
.nav .lbl{flex:1;white-space:nowrap}
.nav .cnt{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--side-ink)}
.nav .cnt.bad{background:#c8423b;color:#fff}.nav .cnt.ok{background:rgba(111,214,160,.22);color:#bff0d5}
.nav button[disabled]{opacity:.38;cursor:default}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;background:rgba(255,255,255,.07);border-radius:10px;padding:3px}
.seg button{all:unset;flex:1;text-align:center;font-size:12px;font-weight:700;padding:6px 4px;border-radius:8px;color:var(--side-muted);cursor:pointer}
.seg button.on{background:var(--teal);color:#fff}
.collapse-btn{all:unset;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--side-muted);font-size:13px;font-weight:600;cursor:pointer}
.collapse-btn:hover{background:var(--side-hover)}
.ver{color:var(--side-muted);font-size:11.5px;padding:0 10px}
.app.collapsed .lbl,.app.collapsed .cnt,.app.collapsed .brand div,.app.collapsed .seg,.app.collapsed .ver,.app.collapsed .collapse-btn span{display:none}
.app.collapsed .nav button,.app.collapsed .collapse-btn{justify-content:center}
.app.collapsed .collapse-btn svg{transform:rotate(180deg)}
/* main */
.main{min-width:0;padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:15px;font-weight:800;margin:0}
.sub{color:var(--muted);margin:4px 0 0;max-width:70ch}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px 22px}
.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:700;font-size:13.5px}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.btn.primary:hover{background:var(--teal-deep)}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.45;cursor:default}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
/* load */
.drops{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.drop{position:relative;border:2px dashed var(--line);border-radius:var(--r);background:var(--card);padding:22px;display:flex;flex-direction:column;gap:10px;min-height:170px;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--teal);background:var(--teal-soft)}
.drop.has{border-style:solid;border-color:var(--teal)}
.drop .tag{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-deep)}
:root[data-theme="dark"] .drop .tag{color:var(--teal)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drop .tag{color:var(--teal)}}
.drop .fname{font-weight:800;font-size:15.5px;word-break:break-word}
.drop .meta{color:var(--muted);font-size:13px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .hint{color:var(--muted);font-size:13.5px}
.drop .ok{color:var(--green);font-weight:700;font-size:13px}
.drop .err{color:var(--red);font-weight:700;font-size:13px}
.what{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.what div{padding:14px 16px;border-radius:12px;background:var(--card-2);border:1px solid var(--line)}
.what b{display:block;font-weight:800;margin-bottom:2px}
.what span{color:var(--muted);font-size:13px}
.busy{display:flex;align-items:center;gap:12px;font-weight:700;color:var(--teal-deep)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--teal-soft);border-top-color:var(--teal);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* summary */
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding:22px 24px}
.vicon{width:54px;height:54px;border-radius:14px;display:grid;place-items:center}
.vicon svg{width:28px;height:28px}
.vicon.bad{background:var(--red-bg);color:var(--red)}.vicon.ok{background:var(--green-bg);color:var(--green)}.vicon.warn{background:var(--amber-bg);color:var(--amber)}
.verdict h2{font-size:22px}
.verdict p{margin:4px 0 0;color:var(--muted)}
.files{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fcard{padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.fcard .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.fcard .nm{font-size:12.5px;color:var(--muted);word-break:break-word}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.kv div{display:flex;flex-direction:column}
.kv span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kv b{font-size:18px;font-weight:800;white-space:nowrap}
.checks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.ck{padding:16px 18px;display:flex;flex-direction:column;gap:10px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.ck:hover{border-color:var(--teal)}
.ck .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ck .big{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em}
.ck ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.ck ul b{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-red{background:var(--red-bg);color:var(--red)}.p-amber{background:var(--amber-bg);color:var(--amber)}.p-green{background:var(--green-bg);color:var(--green)}.p-slate{background:var(--slate-bg);color:var(--slate)}.p-blue{background:var(--blue-bg);color:var(--blue)}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.todo{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:t}
.todo li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;counter-increment:t}
.todo li::before{content:counter(t);width:26px;height:26px;border-radius:8px;background:var(--teal-soft);color:var(--teal-deep);font-weight:800;display:grid;place-items:center;font-size:13px}
:root[data-theme="dark"] .todo li::before{color:var(--teal)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .todo li::before{color:var(--teal)}}
.todo b{font-weight:800}
.todo span{color:var(--muted);font-size:13.5px}
.dates{margin-top:12px;display:flex;flex-direction:column;gap:4px;max-height:420px;overflow:auto;padding-right:4px}
.drow{display:grid;grid-template-columns:92px minmax(0,1fr) 46px;gap:10px;align-items:center;padding:5px 8px;border-radius:8px;font-size:13px;border:0;background:none;text-align:left;width:100%}
.drow:hover{background:var(--card-2)}
.drow .d{font-weight:700}
.bar{display:flex;height:12px;border-radius:4px;overflow:hidden;background:var(--card-2)}
.bar i{display:block;height:100%}
.bar .o{background:var(--red)}.bar .c{background:var(--blue)}.bar .x{background:var(--amber)}.bar .n{background:var(--faint)}
.drow .n2{text-align:right;font-weight:800}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* tables + filters */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.chip em{font-style:normal;opacity:.75}
.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card-2)}
.datechip{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.tbl-wrap{overflow:auto;max-height:68vh}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
th{position:sticky;top:0;background:var(--card-2);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td.prod{font-weight:700;min-width:200px}
.two-val{display:flex;flex-direction:column;gap:2px}
.two-val span{display:flex;gap:6px;align-items:baseline}
.two-val small{font-size:10.5px;font-weight:800;color:var(--faint);width:14px}
.diffv{background:var(--amber-bg);color:var(--amber);border-radius:5px;padding:0 5px;font-weight:700}
.rown{color:var(--muted);font-size:12.5px;white-space:nowrap}
.neg{color:var(--red)}.pos{color:var(--green)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;font-weight:800;margin-bottom:4px}
.more{padding:12px 16px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.note{font-size:13px;color:var(--muted);font-weight:500}
.issue{border-top:1px solid var(--line)}
.issue:first-child{border-top:0}
.issue summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:14px 18px}
.issue summary::-webkit-details-marker{display:none}
.issue summary:hover{background:var(--card-2)}
.issue .it{font-weight:800}
.issue .ie{color:var(--muted);font-size:13px}
.issue .ic{font-weight:800;font-size:18px}
.issue .chev{transition:transform .15s;color:var(--muted)}
.issue[open] .chev{transform:rotate(90deg)}
.issue .body{padding:0 18px 16px}
.issue .body .tbl-wrap{border:1px solid var(--line);border-radius:10px;max-height:420px}
.fileTabs{display:flex;gap:6px}
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:10px;font-weight:700;font-size:13.5px;z-index:60;box-shadow:var(--shadow)}
.warnline{font-size:12.5px;font-weight:700;color:var(--amber)}
.fromrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fromrow input{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card-2);width:150px}
.lastcheck{font-size:13px;color:var(--muted)}
.paste{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.paste .card{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.paste .card b{font-size:15px}
.lock{max-width:460px;margin:14vh auto;padding:28px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.backbtn{all:unset;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--side-ink);font-size:13px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.07)}
.backbtn:hover{background:var(--side-hover)}
.app.collapsed .backbtn span{display:none}
@media (max-width:820px){.backbtn span{display:none}.paste{grid-template-columns:1fr}}
textarea.copybox{width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;background:var(--card-2);padding:12px;font:12.5px/1.5 ui-monospace,Consolas,monospace;color:var(--ink)}
@media (max-width:1000px){.checks{grid-template-columns:1fr 1fr}.what{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
@media (max-width:820px){
  .app,.app.collapsed{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));overflow-x:auto}
  .brand div,.side-foot .ver,.collapse-btn{display:none}
  .nav{flex-direction:row}
  .nav .cnt{display:none}
  .side-foot{margin:0 0 0 auto}
  .app.collapsed .lbl{display:inline}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
  .drops,.files{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){.checks,.what{grid-template-columns:1fr}.verdict{grid-template-columns:1fr}.issue summary{grid-template-columns:auto minmax(0,1fr) auto}.issue .chev{display:none}}

:root[data-theme="light"]{color-scheme:only light}
:root[data-theme="dark"]{color-scheme:only dark}
</style>

<div class="app" id="app">
  <aside class="side">
    <div class="brand"><span class="logo" aria-hidden="true"></span><div><b>IMS Sheet Check</b><small>Original vs Entry copy</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="backbtn" id="backBtn" title="Back to Production entry"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 6l-6 6 6 6M4 12h16"/></svg><span>Back to Production entry</span></button>
      <div class="seg" id="themeSeg" role="group" aria-label="Theme">
        <button data-t="light">Light</button><button data-t="dark">Dark</button><button data-t="auto">Auto</button>
      </div>
      <button class="collapse-btn" id="collapseBtn" aria-label="Collapse sidebar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg><span>Collapse</span></button>
      <div class="ver">v2.1.1 · WH · BB2 · BB1</div>
    </div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>

<script>
"use strict";
const VERSION = "2.1.0";
/* =====================================================================
   1. XLSX READER (no library: ZIP + XML read in the browser)
   ===================================================================== */
async function inflateRaw(u8){
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
function readZip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;

const KIND = {

  onlyC: {label:"Missing in Original", short:"Missing in Original", cls:"p-blue", bar:"c", help:"This entry is in the Entry copy but not in the Original."},
  name:  {label:"Product name differs", short:"Name differs", cls:"p-amber", bar:"x", help:"Same date, qty, godown and type, but a different product name. Check which name is right."},
  "case":{label:"Name spelling differs", short:"Spelling differs", cls:"p-amber", bar:"x", help:"Same entry; the name differs only in capital letters or spaces."},
  qty:   {label:"Quantity differs", short:"Qty differs", cls:"p-amber", bar:"x", help:"Same date, product, godown and type, but a different quantity."},
  loc:   {label:"Godown differs", short:"Godown differs", cls:"p-amber", bar:"x", help:"Same entry, but entered at a different godown."},

  pass(r => [dKey(r), qKey(r), r.L, tKey(r)].join("|"), () => "name");               // product differs
  pass(r => [dKey(r), r.pn, r.L, tKey(r)].join("|"), () => "qty");
  pass(r => [dKey(r), r.pn, qKey(r), tKey(r)].join("|"), () => "loc");
  pass(r => [dKey(r), r.pn, qKey(r), r.L].join("|"), () => "type");

    const m = new Map();
    b.forEach(x => { const k = [x.r.pn, qKey(x.r), x.r.L, tKey(x.r)].join("|"); if(!m.has(k)) m.set(k, []); m.get(k).push(x); });

// what the sheet's own SUMIFS adds up per product (case-insensitive name, exact godown, numbers only)
function entryTotals(f){

    if(r.qty == null) return; const g = r.loc.toUpperCase(); if(!GODOWNS.includes(g)) return;

const near = (a,b) => Math.abs(a - b) < 0.005;
const r2 = n => Math.round(n * 100) / 100;

function compareStock(O, Cp, diffIn, diffOut){
  const tO = entryTotals(O), tC = entryTotals(Cp);
  const mapO = new Map(O.cs.map(x => [x.pn, x])), mapC = new Map(Cp.cs.map(x => [x.pn, x]));
  const keys = [...new Set([...mapO.keys(), ...mapC.keys()])];
  const related = (pn, g) => {
    const out = [];
    const touch = (r) => r && r.pn === pn && r.L === g;
    diffIn.forEach(d => { if(touch(d.o) || touch(d.c)) out.push({d, tab:"IN"}); });
    diffOut.forEach(d => { if(touch(d.o) || touch(d.c)) out.push({d, tab:"OUT"}); });
    return out;
  };
  const rows = [], onlyO = [], onlyC = [];
  for(const k of keys){
    const o = mapO.get(k), c = mapC.get(k);
    if(!o){ onlyC.push(c); continue; } if(!c){ onlyO.push(o); continue; }
    for(const g of GODOWNS){
      if(near(o[g], c[g])) continue;
      const eo = tO.get(o.pl) || {WH:0,BB2:0,BB1:0}, ec = tC.get(c.pl) || {WH:0,BB2:0,BB1:0};
      const explained = near(o[g] - c[g], eo[g] - ec[g]);
      const rel = related(k, g);
      let why = "unexplained";
      if(explained && rel.length) why = rel.every(x => x.d.kind === "newerO" || x.d.kind === "newerC") ? "behind" : "entries";
      else if(explained) why = "entries";
      rows.push({name:o.name, cat:o.cat || c.cat, g, o:o[g], c:c[g], diff:r2(o[g] - c[g]), why, rel, rO:o.r, rC:c.r});
    }
  }
  const rank = {unexplained:0, entries:1, behind:2};
  rows.sort((a,b) => rank[a.why] - rank[b.why]);

}

function compareHelper(O, Cp){
  const mO = new Map(), mC = new Map();
  O.helper.forEach(x => { if(!mO.has(x.pn)) mO.set(x.pn, x); });
  Cp.helper.forEach(x => { if(!mC.has(x.pn)) mC.set(x.pn, x); });
  const onlyO = [...mO.values()].filter(x => !mC.has(x.pn));
  const onlyC = [...mC.values()].filter(x => !mO.has(x.pn));
  const catDiff = [...mO.values()].filter(x => mC.has(x.pn) && normName(x.cat) !== normName(mC.get(x.pn).cat)).map(x => ({o:x, c:mC.get(x.pn)}));
  const nameCase = [...mO.values()].filter(x => mC.has(x.pn) && x.name !== mC.get(x.pn).name).map(x => ({o:x, c:mC.get(x.pn)}));

function healthOf(fAll, fromDs){

  const csNames = new Set(f.cs.map(x => x.pl));

    logs.filter(r => r.qtyText != null && r.product.trim()), logCols);
  add("red","unknown","Product name not in Current Stock — not counted",
    "These names don't match any product in CURRENT STOCK, so the quantity never reaches stock. Pick the name from the dropdown.",
    groupByName(logs.filter(r => r.product.trim() && !csNames.has(r.pl)), csTrim), ["product","count","rowsList","hint"]);
  add("red","locBad","Godown missing or wrong — not counted",
    "Location must be exactly WH, BB2 or BB1.",
    logs.filter(r => r.product.trim() && !GODOWNS.includes(r.loc.toUpperCase())), logCols);
  add("amber","qtyDate","Quantity shows as a date",
    "The cell is formatted as a date, so it shows as a date in the sheet. It still counts as the number shown here. Change the cell format to Number.",
    logs.filter(r => r.qtyDateFmt), logCols);
  add("amber","qtyBlank","Quantity is blank",
    "The row has a product but no quantity.",
    logs.filter(r => r.product.trim() && r.qty == null && r.qtyText == null), logCols);
  add("amber","qtyNeg","Quantity is negative or zero",
    "Stock In and Stock Out quantities should be positive numbers.",
    logs.filter(r => r.qty != null && r.qty <= 0), logCols);
  add("amber","dateBad","Date missing or not a real date",
    "Enter the date as DD-MM-YYYY.",
    logs.filter(r => r.ds == null), logCols);
  add("amber","dateOdd","Date looks out of place",
    "This date is far from the dates of the rows around it. Often a typing slip, like 01-07 instead of 07-01, or the wrong month.",
    oddDates(f.in, "STOCK IN").concat(oddDates(f.out, "STOCK OUT")), logCols);
  add("amber","typeBad","Type is blank or unusual",
    "Stock In types: Opening balance, Production, Transfer in, Return, Purchase, Stock Correction. Stock Out types: Sales, Transfer Out, Usage, Stock correction.",
    logs.filter(r => r.product.trim() && !(r.tab === "STOCK IN" ? IN_TYPES : OUT_TYPES).includes(r.T)), logCols);
  add("amber","transfer","Transfer in and Transfer Out don't balance",
    "For this date and product, Transfer in (Stock In) and Transfer Out (Stock Out) are not the same total. Normal if goods came from or went to another branch; otherwise one side is missing or has a different date.",
    transfers(f), ["date","product","tin","tout","gap"]);
  // current stock and helper
  const totals = entryTotals(fAll);
  const csRows = [];
  f.cs.forEach(x => { const e = totals.get(x.pl) || {WH:0,BB2:0,BB1:0};
    GODOWNS.forEach(g => { if(!near(x[g], e[g])) csRows.push({r:x.r, product:x.name, g, shown:x[g], calc:r2(e[g])}); }); });
  add("red","csCalc","Current Stock doesn't match the entries",
    "Current Stock should equal all Stock In minus all Stock Out for that product and godown. If you see this, the formula or the download is out of date.",
    csRows, ["r","product","g","shown","calc"]);
  add("amber","total","Total Stock ≠ WH + BB2 + BB1",
    "The Total column doesn't equal the sum of the three godowns.",
    f.cs.filter(x => x.hasTotal && !near(x.total, x.WH + x.BB2 + x.BB1)).map(x => ({r:x.r, product:x.name, WH:x.WH, BB2:x.BB2, BB1:x.BB1, total:x.total})), ["r","product","WH","BB2","BB1","total"]);
  const hp = new Set(f.helper.map(x => x.pn));
  add("amber","csNoHelper","In Current Stock but not in Helper Sheet",
    "These products are missing from the Helper Sheet, so they won't appear in the entry dropdown.",
    f.cs.filter(x => !hp.has(x.pn)).map(x => ({r:x.r, product:x.name, cat:x.cat})), ["r","product","cat"]);
  add("amber","helperNoCs","In Helper Sheet but not in Current Stock",
    "These products can be picked in the dropdown, but Current Stock has no row for them.",
    f.helper.filter(x => !csTrim.has(x.pn)).map(x => ({r:x.r, product:x.name, cat:x.cat})), ["r","product","cat"]);
  add("amber","dup","Product listed twice",
    "The same product name appears on more than one row.",
    dups(f.cs, "CURRENT STOCK").concat(dups(f.helper, "HELPER SHEET")), ["tab","product","rowsList"]);
  const order = {red:0, amber:1};
  issues.sort((a,b) => order[a.sev] - order[b.sev]);
  return issues;
}
function groupByName(rows, csTrim){
  const m = new Map();
  rows.forEach(r => { const k = r.product; if(!m.has(k)) m.set(k, {product:k, count:0, rows:[]}); const e = m.get(k); e.count++; e.rows.push((r.tab === "STOCK IN" ? "IN " : "OUT ") + r.r); });
  return [...m.values()].sort((a,b) => b.count - a.count).map(e => ({...e, rowsList: e.rows.slice(0,6).join(", ") + (e.rows.length > 6 ? " +" + (e.rows.length - 6) + " more" : ""),
    hint: csTrim.has(normName(e.product)) ? "Extra space in the name" : ""}));
}
function oddDates(list, tab){
  const out = [];
  for(let i = 0; i < list.length; i++){
    const r = list[i]; if(r.ds == null) continue;
    const nb = [];
    for(let j = Math.max(0, i - 6); j <= Math.min(list.length - 1, i + 6); j++){ if(j !== i && list[j].ds != null) nb.push(list[j].ds); }
    if(nb.length < 4) continue;
    nb.sort((a,b) => a - b); const med = nb[Math.floor(nb.length / 2)];
    if(Math.abs(r.ds - med) > 20) out.push({...r, tab, note: "Rows around it: " + serialToStr(med)});
  }
  return out;
}
function transfers(f){
  const m = new Map();
  const add = (r, side) => { if(r.qty == null || r.ds == null) return; const k = r.ds + "|" + r.pn; if(!m.has(k)) m.set(k, {ds:r.ds, product:r.product, tin:0, tout:0}); m.get(k)[side] += r.qty; };
  f.in.filter(r => r.T === "transfer in").forEach(r => add(r, "tin"));
  f.out.filter(r => r.T === "transfer out").forEach(r => add(r, "tout"));
  return [...m.values()].filter(e => !near(e.tin, e.tout)).map(e => ({...e, date: serialToStr(e.ds), gap: r2(e.tin - e.tout)})).sort((a,b) => a.ds - b.ds);
}
function dups(list, tab){
  const m = new Map(); list.forEach(x => { if(!m.has(x.pn)) m.set(x.pn, []); m.get(x.pn).push(x); });
  return [...m.values()].filter(a => a.length > 1).map(a => ({tab, product:a[0].name, rowsList:"rows " + a.map(x => x.r).join(", ")}));
}

/* =====================================================================
   6. RUN
   ===================================================================== */
function runAll(O, Cp, fromDs){
  const keep = r => fromDs == null || r.ds == null || r.ds >= fromDs;
  const dIn = compareLogs(O.in.filter(keep), Cp.in.filter(keep), O.last, Cp.last);
  const dOut = compareLogs(O.out.filter(keep), Cp.out.filter(keep), O.last, Cp.last);
  const stock = compareStock(O, Cp, dIn, dOut);
  const helper = compareHelper(O, Cp);
  return {O, C:Cp, dIn, dOut, stock, helper, hO: healthOf(O, fromDs), hC: healthOf(Cp, fromDs), at: new Date(), fromDs};
}

/* ---------- paste-ready rows: entries missing in one sheet, laid out in the other sheet's column order ---------- */
function pasteRows(key, to){
  const R = S.R, list = key === "in" ? R.dIn : R.dOut;
  const kinds = to === "O" ? ["onlyC","newerC"] : ["onlyO","newerO"];
  const tf = to === "O" ? R.O : R.C, C = tf.cols[key];
  const rows = list.filter(d => kinds.includes(d.kind)).map(d => to === "O" ? d.c : d.o)
    .sort((a,b) => (a.ds ?? 1e9) - (b.ds ?? 1e9) || a.r - b.r);
  const idx = [C.date, C.prod, C.qty, C.loc, C.type].filter(i => i >= 0);
  const width = Math.max(...idx) + 1, first = Math.min(...idx);
  const text = rows.map(r => {
    const a = new Array(width).fill("");
    a[C.date] = r.ds != null ? serialToStr(r.ds) : r.dateText;
    a[C.prod] = tf.canon.get(r.pn) || r.product.trim();
    a[C.qty] = r.qty != null ? String(r.qty) : (r.qtyText || "");
    a[C.loc] = r.L;
    if(C.type >= 0) a[C.type] = r.type;
    return a.slice(first).join("\t");
  }).join("\n");
  return {n: rows.length, text, col: String.fromCharCode(65 + first)};
}

async function copyPaste(key, to){
  const p = pasteRows(key, to);

  await copyText(p.text, $("#copyBox"));
  toast(`${p.n} rows copied — paste in ${SHEETLBL[to]} › ${TABLBL[key]}, column ${p.col} of the first empty row`);
}

    ${ok ? "" : `<p><b>${V.realIn + V.realOut}</b> Stock In/Out entries need a look. Below is what to fix first.</p>`}</div></div>
  <div class="files">${fileCard(R.O,"Original IMS sheet")}${fileCard(R.C,"Entry copy")}</div>
  <div class="checks">
    ${ckLog("in","Stock In", R.dIn, V.realIn, V.newerIn)}
    ${ckLog("out","Stock Out", R.dOut, V.realOut, V.newerOut)}
    <button class="card ck" data-go="stock"><div class="t"><h3>Current Stock</h3>${stReal ? `<span class="pill p-red">${stReal} to fix</span>` : stBehind ? `<span class="pill p-slate">Up to date only</span>` : `<span class="pill p-green">Match</span>`}</div>
      <div class="big">${stReal}</div><ul>
      ${st.rows.length ? `<li><b>${st.rows.length}</b> godown figures differ</li>` : `<li>All WH, BB2, BB1 figures match</li>`}
      ${stBehind ? `<li><b>${stBehind}</b> only because the copy is behind</li>` : ""}
      ${stUnexp ? `<li><b>${stUnexp}</b> not explained by entries</li>` : ""}
      ${st.onlyO.length ? `<li><b>${st.onlyO.length}</b> products only in Original</li>` : ""}${st.onlyC.length ? `<li><b>${st.onlyC.length}</b> products only in Entry copy</li>` : ""}</ul></button>
    <button class="card ck" data-go="helper"><div class="t"><h3>Helper Sheet</h3>${hpN ? `<span class="pill p-red">${hpN} to fix</span>` : `<span class="pill p-green">Match</span>`}</div>
      <div class="big">${hpN}</div><ul>
      <li><b>${R.O.helper.length}</b> vs <b>${R.C.helper.length}</b> products</li>
      ${hp.onlyO.length ? `<li><b>${hp.onlyO.length}</b> only in Original</li>` : ""}${hp.onlyC.length ? `<li><b>${hp.onlyC.length}</b> only in Entry copy</li>` : ""}
      ${hp.catDiff.length ? `<li><b>${hp.catDiff.length}</b> in a different category</li>` : ""}${!hpN ? "<li>Same products, same categories</li>" : ""}</ul></button>
  </div>
  <div class="two">
    <div class="card pad"><h2>What to do</h2>${todo.length ? `<ol class="todo">${todo.map(t => `<li><div><b>${t[0]}</b><br><span>${t[1]}</span></div></li>`).join("")}</ol>` : `<p class="note" style="margin-top:10px">Nothing to fix. Both sheets agree.</p>`}</div>
    <div class="card pad"><h2>Differences by date</h2><p class="note" style="margin:4px 0 0">Stock In and Stock Out together. Click a date to see its rows.</p>
      <div class="legend"><span><i style="background:var(--red)"></i>Missing in copy</span><span><i style="background:var(--blue)"></i>Missing in Original</span><span><i style="background:var(--amber)"></i>Entered differently</span><span><i style="background:var(--faint)"></i>Not in other sheet yet</span></div>
      <div class="dates">${dates.length ? dates.map(([ds,e]) => { const tot = e.o + e.c + e.x + e.n; const w = v => (v / maxD * 100).toFixed(2) + "%";
        return `<button class="drow" data-date="${ds}"><span class="d">${ds < 0 ? "No date" : serialToStr(ds)}</span><span class="bar"><i class="o" style="width:${w(e.o)}"></i><i class="c" style="width:${w(e.c)}"></i><i class="x" style="width:${w(e.x)}"></i><i class="n" style="width:${w(e.n)}"></i></span><span class="n2">${tot}</span></button>`; }).join("") : `<p class="note">No differences.</p>`}</div>
    </div>
  </div>
  ${pasteCard()}
  <div class="card pad"><div class="head"><div><h2>Sheet health</h2><p class="sub">Problems inside each sheet that make Current Stock wrong, even when both sheets agree.</p></div><button class="btn" data-go="health">Open sheet health ${ic("chev",16)}</button></div>
    <div class="files" style="margin-top:14px">
      ${[["Original", R.hO],["Entry copy", R.hC]].map(([n, h]) => `<div><h3 style="margin-bottom:8px">${n}</h3>${h.length ? `<div style="display:flex;flex-direction:column;gap:6px">${h.slice(0,6).map(i => `<div style="display:flex;gap:8px;align-items:center;justify-content:space-between"><span style="font-size:13.5px">${esc(i.title)}</span><span class="pill ${i.sev === "red" ? "p-red" : "p-amber"}">${i.rows.length}</span></div>`).join("")}${h.length > 6 ? `<span class="note">+${h.length - 6} more checks</span>` : ""}</div>` : `<span class="pill p-green">No problems found</span>`}</div>`).join("")}
    </div></div>`;
}
function pasteCard(){
  const box = (key, to) => { const p = pasteRows(key, to);
    return `<div class="card"><span class="note">${TABLBL[key]} → ${SHEETLBL[to]}</span><b>${p.n} row${p.n === 1 ? "" : "s"}</b>
      <span class="note">${p.n ? `Paste in column ${p.col} of the first empty row.` : "Nothing missing."}</span>
      <button class="btn ${p.n ? "primary" : ""}" data-paste="${key}|${to}" ${p.n ? "" : "disabled"}>${ic("copy",16)} Copy rows</button></div>`; };
  return `<div class="card pad"><h2>Paste-ready rows</h2><p class="sub">Entries that are only in one sheet, laid out in the other sheet's column order (date as DD-MM-YYYY). Check them before you paste — an entry only in one sheet can also be a mistake.</p>
    <div class="paste">${box("in","O")}${box("out","O")}${box("in","C")}${box("out","C")}</div></div>`;
}
function buildTodo(R, V){
  const t = [];
  const kI = countKinds(R.dIn), kO = countKinds(R.dOut);
  const n = (k, key) => (k[key] || 0);
  const behind = R.O.last != null && R.C.last != null && R.O.last !== R.C.last;
  if(n(kI,"onlyO") + n(kO,"onlyO")) t.push([`Add ${n(kI,"onlyO") + n(kO,"onlyO")} missing entries to the Entry copy`, `${n(kI,"onlyO")} Stock In and ${n(kO,"onlyO")} Stock Out rows exist in the Original but not in the copy (dated on or before the copy's last entry).`]);
  if(n(kI,"onlyC") + n(kO,"onlyC")) t.push([`Check ${n(kI,"onlyC") + n(kO,"onlyC")} entries that are only in the Entry copy`, `Add them to the Original, or remove them from the copy if they were a mistake.`]);
  const mis = ["name","case","qty","loc","type","date"].map(k => [k, n(kI,k) + n(kO,k)]).filter(x => x[1]);
  if(mis.length) t.push([`Fix ${mis.reduce((s,x) => s + x[1], 0)} entries entered differently`, mis.map(([k,v]) => `${v} ${KIND[k].short.toLowerCase()}`).join(", ") + ". Decide which sheet is right and correct the other."]);
  if(behind && V.newerAll) t.push([`Bring the ${R.O.last > R.C.last ? "Entry copy" : "Original"} up to ${serialToStr(Math.max(R.O.last, R.C.last))}`, `${V.newerAll} newer entries are only in one sheet. After they are added, ${R.stock.rows.filter(r => r.why === "behind").length} Current Stock gaps will close by themselves.`]);
  const unexp = R.stock.rows.filter(r => r.why === "unexplained").length;
  if(unexp) t.push([`Look at ${unexp} Current Stock figures the entries don't explain`, `Usually the Current Stock formula or the download is out of date.`]);
  if(R.stock.onlyO.length + R.stock.onlyC.length + R.helper.onlyO.length + R.helper.onlyC.length) t.push([`Add missing products`, `${R.helper.onlyO.length} Helper Sheet products only in Original, ${R.helper.onlyC.length} only in Entry copy; ${R.stock.onlyO.length} Current Stock products only in Original, ${R.stock.onlyC.length} only in Entry copy.`]);
  if(R.helper.catDiff.length) t.push([`Match ${R.helper.catDiff.length} product categories`, `The same product is under a different category in each Helper Sheet.`]);
  const red = [...R.hO.map(i => ["Original", i]), ...R.hC.map(i => ["Entry copy", i])].filter(x => x[1].sev === "red");
  if(red.length) t.push([`Fix entries the sheets are not counting`, red.map(([f,i]) => `${f}: ${i.rows.length} × ${i.title.split(" — ")[0].toLowerCase()}`).join("; ") + "."]);
  return t;
}

/* ---------- Stock In / Out ---------- */
function cellPair(d, field, render){
  const a = d.o ? render(d.o) : "", b = d.c ? render(d.c) : "";
  if(!d.o || !d.c) return esc(a || b);
  if(String(a) === String(b)) return esc(a);
  return `<div class="two-val"><span><small>O</small><span class="diffv">${esc(a)}</span></span><span><small>C</small><span class="diffv">${esc(b)}</span></span></div>`;
}
const showQty = r => r.qty != null ? fmt(r.qty) : (r.qtyText != null ? r.qtyText : "—");
const showDate = r => r.ds != null ? serialToStr(r.ds) : (r.dateText || "—");
function viewLog(key){
  const R = S.R, list = key === "in" ? R.dIn : R.dOut, F = S.filt[key], title = key === "in" ? "Stock In" : "Stock Out";
  const counts = countKinds(list);
  const order = ["onlyO","onlyC","name","case","qty","loc","type","date","newerO","newerC"].filter(k => counts[k]);
  const kinds = F.kinds;
  const q = normName(F.q);
  const rows = list.filter(d => (!kinds || kinds.includes(d.kind)) && (F.date == null || ((d.o || d.c).ds ?? -1) === F.date) && (!q || (d.o && d.o.pn.includes(q)) || (d.c && d.c.pn.includes(q))));
  const LIMIT = 800;
  return `<div class="head"><div><h1>${title}</h1><p class="sub">Each row is one entry that is not the same in both sheets. <b>O</b> = Original, <b>C</b> = Entry copy. Row numbers are the sheet row numbers, so you can go straight to them.</p></div>
    <div class="row-actions">${(() => { const a = pasteRows(key, "O").n, b = pasteRows(key, "C").n;
      return (a ? `<button class="btn" data-paste="${key}|O">${ic("copy",16)} Copy ${a} rows for Original</button>` : "") + (b ? `<button class="btn" data-paste="${key}|C">${ic("copy",16)} Copy ${b} rows for Entry copy</button>` : ""); })()}
      <button class="btn" id="copyTable">${ic("copy",16)} Copy table</button></div></div>
  <textarea class="copybox" id="copyBox" hidden aria-label="Table text"></textarea>
  <div class="card">
    <div class="toolbar">
      <div class="chips">
        <button class="chip ${!kinds ? "on" : ""}" data-kind="all">All <em>${list.length}</em></button>
        ${order.map(k => `<button class="chip ${kinds && kinds.includes(k) ? "on" : ""}" data-kind="${k}" title="${esc(KIND[k].help)}">${KIND[k].short} <em>${counts[k]}</em></button>`).join("")}
        ${F.date != null ? `<button class="chip datechip" data-cleardate="1">Date ${F.date < 0 ? "none" : serialToStr(F.date)} ✕</button>` : ""}
      </div>
      <input class="search" id="q-${key}" type="search" placeholder="Search product…" value="${esc(F.q)}" aria-label="Search product">
    </div>
    ${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>What</th><th>Date</th><th>Product</th><th class="num">Qty</th><th>Godown</th><th>Type</th><th>Row O</th><th>Row C</th></tr></thead><tbody>
      ${rows.slice(0, LIMIT).map(d => `<tr><td><span class="pill ${KIND[d.kind].cls}" title="${esc(KIND[d.kind].help)}">${KIND[d.kind].short}</span></td>
        <td>${cellPair(d, "date", showDate)}</td><td class="prod">${cellPair(d, "p", r => r.product)}</td><td class="num">${cellPair(d, "q", showQty)}</td>
        <td>${cellPair(d, "l", r => r.loc)}</td><td>${cellPair(d, "t", r => r.type)}</td>
        <td class="rown">${d.o ? d.o.r : "—"}</td><td class="rown">${d.c ? d.c.r : "—"}</td></tr>`).join("")}
      </tbody></table></div>${rows.length > LIMIT ? `<div class="more">Showing the first ${LIMIT} of ${rows.length}. Use the filters or search to narrow down.</div>` : ""}`
    : `<div class="empty"><b>${list.length ? "Nothing matches this filter" : "Every entry matches"}</b>${list.length ? "Clear the filter or search." : `All ${title} rows are the same in both sheets.`}</div>`}
  </div>
  <div class="card pad"><h3>What each label means</h3><div style="display:grid;gap:8px;margin-top:10px">${order.map(k => `<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><span class="pill ${KIND[k].cls}">${KIND[k].short}</span><span class="note">${esc(KIND[k].help)}</span></div>`).join("") || `<span class="note">No differences.</span>`}</div></div>`;
}

/* ---------- Current Stock ---------- */
const WHY = {
  behind:{short:"Copy not updated yet", cls:"p-slate", help:"The whole gap comes from entries made after the other sheet's last entry. It closes once the sheet is brought up to date."},
  entries:{short:"Entry differences", cls:"p-amber", help:"The gap is explained by Stock In/Out entries that differ. Fix those entries and this closes."},
  unexplained:{short:"Not explained", cls:"p-red", help:"The entries don't explain this gap. The Current Stock formula or the download may be out of date."}
};
function viewStock(){
  const R = S.R, st = R.stock, F = S.filt.stock, q = normName(F.q);
  const counts = {}; st.rows.forEach(r => counts[r.why] = (counts[r.why] || 0) + 1);
  const rows = st.rows.filter(r => (!F.why || r.why === F.why) && (!q || normName(r.name).includes(q)));
  const relText = r => {
    if(!r.rel.length) return "";
    const ks = {}; r.rel.forEach(x => ks[x.tab + " · " + KIND[x.d.kind].short] = (ks[x.tab + " · " + KIND[x.d.kind].short] || 0) + 1);
    return Object.entries(ks).map(([k,v]) => `${v} × ${k}`).join(", ");
  };
  return `<div class="head"><div><h1>Current Stock</h1><p class="sub">Stock at each godown, Original vs Entry copy. Difference = Original − Entry copy. The last column says which Stock In/Out differences cause the gap.</p></div>
    <div class="row-actions"><button class="btn" id="copyTable">${ic("copy",16)} Copy table</button></div></div>
  <textarea class="copybox" id="copyBox" hidden aria-label="Table text"></textarea>
  <div class="card">
    <div class="toolbar"><div class="chips">
      <button class="chip ${!F.why ? "on" : ""}" data-why="">All <em>${st.rows.length}</em></button>
      ${["unexplained","entries","behind"].filter(k => counts[k]).map(k => `<button class="chip ${F.why === k ? "on" : ""}" data-why="${k}" title="${esc(WHY[k].help)}">${WHY[k].short} <em>${counts[k]}</em></button>`).join("")}
    </div><input class="search" id="q-stock" type="search" placeholder="Search product…" value="${esc(F.q)}" aria-label="Search product"></div>
    ${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>Product</th><th>Godown</th><th class="num">Original</th><th class="num">Entry copy</th><th class="num">Difference</th><th>Why</th><th>Caused by</th><th>Row O / C</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td class="prod">${esc(r.name)}<div class="note">${esc(r.cat)}</div></td><td><b>${r.g}</b></td><td class="num">${fmt(r.o)}</td><td class="num">${fmt(r.c)}</td>
        <td class="num ${r.diff < 0 ? "neg" : "pos"}"><b>${r.diff > 0 ? "+" : ""}${fmt(r.diff)}</b></td>
        <td><span class="pill ${WHY[r.why].cls}" title="${esc(WHY[r.why].help)}">${WHY[r.why].short}</span></td><td class="note">${esc(relText(r))}</td><td class="rown">${r.rO} / ${r.rC}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty"><b>${st.rows.length ? "Nothing matches this filter" : "All godown figures match"}</b>${st.rows.length ? "Clear the filter or search." : "WH, BB2 and BB1 are the same in both sheets for every product."}</div>`}
  </div>
  ${(st.onlyO.length || st.onlyC.length) ? `<div class="files">
    ${[["Only in Original", st.onlyO],["Only in Entry copy", st.onlyC]].map(([t, l]) => `<div class="card"><div class="pad" style="padding-bottom:10px"><h3>${t} <span class="pill ${l.length ? "p-red" : "p-green"}">${l.length}</span></h3></div>
      ${l.length ? `<div class="tbl-wrap" style="max-height:340px"><table><thead><tr><th>Row</th><th>Product</th><th>Category</th><th class="num">WH</th><th class="num">BB2</th><th class="num">BB1</th></tr></thead><tbody>${l.map(x => `<tr><td class="rown">${x.r}</td><td class="prod">${esc(x.name)}</td><td>${esc(x.cat)}</td><td class="num">${fmt(x.WH)}</td><td class="num">${fmt(x.BB2)}</td><td class="num">${fmt(x.BB1)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty" style="padding:16px">None</div>`}</div>`).join("")}
  </div>` : ""}
  <div class="card pad"><h3>What the labels mean</h3><div style="display:grid;gap:8px;margin-top:10px">${Object.values(WHY).map(w => `<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><span class="pill ${w.cls}">${w.short}</span><span class="note">${esc(w.help)}</span></div>`).join("")}</div></div>`;
}

/* ---------- Helper ---------- */
function viewHelper(){
  const R = S.R, h = R.helper;
  const block = (title, sub, list, cols) => `<div class="card"><div class="pad" style="padding-bottom:10px"><h3>${title} <span class="pill ${list.length ? "p-red" : "p-green"}">${list.length}</span></h3><p class="note" style="margin:4px 0 0">${sub}</p></div>
    ${list.length ? `<div class="tbl-wrap" style="max-height:420px"><table><thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join("")}</tr></thead><tbody>${list.map(x => `<tr>${cols.map(c => `<td class="${c[2] || ""}">${esc(c[1](x))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : `<div class="empty" style="padding:18px">None</div>`}</div>`;
  return `<div class="head"><div><h1>Helper Sheet</h1><p class="sub">The product list behind the entry dropdown. Original has <b>${R.O.helper.length}</b> products, Entry copy has <b>${R.C.helper.length}</b>.</p></div></div>
  <div class="files">
    ${block("Only in Original","Add these to the Entry copy's Helper Sheet (and Current Stock).", h.onlyO, [["Row", x => x.r, "rown"],["Product", x => x.name, "prod"],["Category", x => x.cat]])}
    ${block("Only in Entry copy","Add these to the Original, or remove them from the copy.", h.onlyC, [["Row", x => x.r, "rown"],["Product", x => x.name, "prod"],["Category", x => x.cat]])}
  </div>
  ${block("Different category","Same product, filed under a different category.", h.catDiff, [["Product", x => x.o.name, "prod"],["Original", x => x.o.cat],["Entry copy", x => x.c.cat],["Row O / C", x => x.o.r + " / " + x.c.r, "rown"]])}
  ${h.nameCase.length ? block("Name spelled differently","Same product, but capital letters or spaces differ. Entries still count, but it's tidier to match.", h.nameCase, [["Original", x => x.o.name, "prod"],["Entry copy", x => x.c.name, "prod"],["Row O / C", x => x.o.r + " / " + x.c.r, "rown"]]) : ""}`;
}

/* ---------- Health ---------- */
const COLDEF = {
  tab:["Tab", r => r.tab], r:["Row", r => r.r, "rown"], date:["Date", r => r.date ?? showDate(r)], product:["Product", r => r.product, "prod"],
  qtyShow:["Qty", r => showQty(r), "num"], loc:["Godown", r => r.loc || "—"], type:["Type", r => (r.type || "—") + (r.note ? " · " + r.note : "")],
  count:["Rows", r => r.count, "num"], rowsList:["Where", r => r.rowsList, "rown"], hint:["Note", r => r.hint],
  tin:["Transfer in", r => fmt(r.tin), "num"], tout:["Transfer Out", r => fmt(r.tout), "num"], gap:["In − Out", r => fmt(r.gap), "num"],
  g:["Godown", r => r.g], shown:["Shown", r => fmt(r.shown), "num"], calc:["From entries", r => fmt(r.calc), "num"],
  WH:["WH", r => fmt(r.WH), "num"], BB2:["BB2", r => fmt(r.BB2), "num"], BB1:["BB1", r => fmt(r.BB1), "num"], total:["Total", r => fmt(r.total), "num"], cat:["Category", r => r.cat]
};
function viewHealth(){
  const R = S.R, which = S.filt.health, list = which === "O" ? R.hO : R.hC, f = which === "O" ? R.O : R.C;
  return `<div class="head"><div><h1>Sheet health</h1><p class="sub">Problems inside one sheet. Red items are not counted in Current Stock at all. Amber items are counted but look wrong.</p></div>
    <div class="fileTabs"><button class="chip ${which === "O" ? "on" : ""}" data-health="O">Original <em>${R.hO.length}</em></button><button class="chip ${which === "C" ? "on" : ""}" data-health="C">Entry copy <em>${R.hC.length}</em></button></div></div>
  <div class="card">${list.length ? list.map(i => `<details class="issue"><summary><span class="pill ${i.sev === "red" ? "p-red" : "p-amber"}">${i.sev === "red" ? "Not counted" : "Check"}</span>
      <div><div class="it">${esc(i.title)}</div><div class="ie">${esc(i.explain)}</div></div><span class="ic">${i.rows.length}</span><span class="chev">${ic("chev",18)}</span></summary>
      <div class="body"><div class="tbl-wrap"><table><thead><tr>${i.cols.map(c => `<th class="${COLDEF[c][2] === "num" ? "num" : ""}">${COLDEF[c][0]}</th>`).join("")}</tr></thead><tbody>
      ${i.rows.slice(0, 500).map(r => `<tr>${i.cols.map(c => `<td class="${COLDEF[c][2] || ""}">${esc(COLDEF[c][1](r))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      ${i.rows.length > 500 ? `<div class="more">Showing 500 of ${i.rows.length}.</div>` : ""}</div></details>`).join("")
    : `<div class="empty"><b>No problems found</b>${esc(f.fileName)} looks clean.</div>`}</div>`;
}

/* ---------- copy text ---------- */
function reportText(){
  const R = S.R, V = verdictOf(R), t = [];
  t.push(`IMS SHEET CHECK — ${serialToStr(todaySerial())} (v${VERSION})`);
  t.push(`Original: ${R.O.fileName} — last entry ${R.O.last != null ? serialToStr(R.O.last) : "-"}`);
  t.push(`Entry copy: ${R.C.fileName} — last entry ${R.C.last != null ? serialToStr(R.C.last) : "-"}`);
  t.push("");
  t.push(V.realAll ? "RESULT: The sheets don't match." : "RESULT: The sheets match" + (V.newerAll ? " (one is not up to date)." : "."));
  t.push(dateLine(R).replace(/<[^>]+>/g, ""));
  const line = (nm, l) => { const k = countKinds(l); return `${nm}: ` + (Object.keys(k).length ? Object.entries(k).map(([a,b]) => `${b} ${KIND[a].short.toLowerCase()}`).join(", ") : "all match"); };
  t.push(line("Stock In", R.dIn)); t.push(line("Stock Out", R.dOut));
  t.push(`Current Stock: ${R.stock.rows.length} godown figures differ (${R.stock.rows.filter(r => r.why === "behind").length} only because a sheet is behind, ${R.stock.rows.filter(r => r.why === "unexplained").length} not explained)`);
  t.push(`Helper Sheet: ${R.helper.onlyO.length} only in Original, ${R.helper.onlyC.length} only in Entry copy, ${R.helper.catDiff.length} different category`);
  t.push(""); t.push("WHAT TO DO");
  buildTodo(R, V).forEach((x, i) => t.push(`${i + 1}. ${x[0]} — ${x[1]}`));
  return t.join("\n");
}
function tableText(){
  const v = S.view, R = S.R;
  if(v === "in" || v === "out"){
    const F = S.filt[v], q = normName(F.q), list = v === "in" ? R.dIn : R.dOut;
    const rows = list.filter(d => (!F.kinds || F.kinds.includes(d.kind)) && (F.date == null || ((d.o || d.c).ds ?? -1) === F.date) && (!q || (d.o && d.o.pn.includes(q)) || (d.c && d.c.pn.includes(q))));
    const p = (d, fn) => d.o && d.c && fn(d.o) !== fn(d.c) ? fn(d.o) + " / " + fn(d.c) : fn(d.o || d.c);
    return ["What\tDate\tProduct\tQty\tGodown\tType\tRow Original\tRow Entry copy"].concat(rows.map(d => [KIND[d.kind].short, p(d, showDate), p(d, r => r.product), p(d, showQty), p(d, r => r.loc), p(d, r => r.type), d.o ? d.o.r : "", d.c ? d.c.r : ""].join("\t"))).join("\n");
  }
  if(v === "stock"){
    const F = S.filt.stock, q = normName(F.q);
    return ["Product\tGodown\tOriginal\tEntry copy\tDifference\tWhy"].concat(R.stock.rows.filter(r => (!F.why || r.why === F.why) && (!q || normName(r.name).includes(q))).map(r => [r.name, r.g, r.o, r.c, r.diff, WHY[r.why].short].join("\t"))).join("\n");
  }
  return "";
}

/* ---------- events ---------- */
function bindView(){
  const el = $("#view");
  el.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
  el.querySelectorAll(".drow").forEach(b => b.addEventListener("click", () => {
    const ds = +b.dataset.date; const R = S.R;
    const has = l => l.some(d => ((d.o || d.c).ds ?? -1) === ds);
    const target = has(R.dIn) && !has(R.dOut) ? "in" : has(R.dOut) && !has(R.dIn) ? "out" : (countAt(R.dOut, ds) >= countAt(R.dIn, ds) ? "out" : "in");
    S.filt.in.date = ds; S.filt.out.date = ds; S.filt.in.kinds = null; S.filt.out.kinds = null; go(target);
  }));
  el.querySelectorAll("[data-paste]").forEach(b => b.addEventListener("click", () => { const [k, t] = b.dataset.paste.split("|"); copyPaste(k, t); }));
  const fd = $("#fromDate"); if(fd){
    fd.addEventListener("input", () => { let v = fd.value.replace(/\D/g, "").slice(0, 8), o = v.slice(0, 2); if(v.length > 2) o += "-" + v.slice(2, 4); if(v.length > 4) o += "-" + v.slice(4); fd.value = o; });
    fd.addEventListener("change", () => { setFrom(fd.value); if(S.files.O && S.files.C && !S.fromErr) toast("Press Compare now to apply"); else render(); });
  }
  const cr = $("#copyReport"); if(cr) cr.addEventListener("click", () => copyText(reportText(), $("#copyBox")));
  const ct = $("#copyTable"); if(ct) ct.addEventListener("click", () => copyText(tableText(), $("#copyBox")));
  if(S.view === "load"){
    el.querySelectorAll(".drop").forEach(d => {
      const k = d.dataset.slot;
      d.querySelector("input").addEventListener("change", e => takeFiles([...e.target.files], k));
      d.addEventListener("dragover", e => { e.preventDefault(); d.classList.add("over"); });
      d.addEventListener("dragleave", () => d.classList.remove("over"));
      d.addEventListener("drop", e => { e.preventDefault(); d.classList.remove("over"); takeFiles([...e.dataTransfer.files], k); });
    });
    const rb = $("#runBtn"); if(rb) rb.addEventListener("click", run);
    const sb = $("#swapBtn"); if(sb) sb.addEventListener("click", () => { const t = S.files.O; S.files.O = S.files.C; S.files.C = t; const s = S.status.O; S.status.O = S.status.C; S.status.C = s; S.R = null; render(); });
  }
  if(S.view === "in" || S.view === "out"){
    const key = S.view, F = S.filt[key];
    el.querySelectorAll("[data-kind]").forEach(b => b.addEventListener("click", () => {
      const k = b.dataset.kind;
      if(k === "all") F.kinds = null; else { const cur = F.kinds || []; F.kinds = cur.includes(k) ? cur.filter(x => x !== k) : [...cur, k]; if(!F.kinds.length) F.kinds = null; }
      render();
    }));
    const cd = el.querySelector("[data-cleardate]"); if(cd) cd.addEventListener("click", () => { S.filt.in.date = null; S.filt.out.date = null; render(); });
    bindSearch("#q-" + key, F);
  }
  if(S.view === "stock"){
    el.querySelectorAll("[data-why]").forEach(b => b.addEventListener("click", () => { S.filt.stock.why = b.dataset.why || null; render(); }));
    bindSearch("#q-stock", S.filt.stock);
  }
  if(S.view === "health") el.querySelectorAll("[data-health]").forEach(b => b.addEventListener("click", () => { S.filt.health = b.dataset.health; render(); }));
}
function countAt(l, ds){ return l.filter(d => ((d.o || d.c).ds ?? -1) === ds).length; }
let searchT = null;
function bindSearch(sel, F){
  const i = $(sel); if(!i) return;
  i.addEventListener("input", () => { clearTimeout(searchT); searchT = setTimeout(() => { F.q = i.value; const pos = i.selectionStart; render(); const n = $(sel); if(n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} } }, 180); });
}
async function takeFiles(files, slot){
  files = files.filter(f => /\.xlsx$/i.test(f.name) || f.type.includes("spreadsheet"));
  if(!files.length){ S.status[slot] = "!Pick an .xlsx file (File → Download → Microsoft Excel)."; render(); return; }
  S.busy = true; render();
  await new Promise(r => setTimeout(r, 30));
  const parsed = [];
  for(const f of files.slice(0, 2)){
    try{ parsed.push(await parseFile(await f.arrayBuffer(), f.name)); }
    catch(e){ S.status[slot] = "!" + f.name + ": " + (e.message || e); }
  }
  if(parsed.length === 2){
    const [a, b] = parsed; const copyFirst = a.isCopy && !b.isCopy;
    S.files.O = copyFirst ? b : a; S.files.C = copyFirst ? a : b;
    S.status.O = "Read OK"; S.status.C = S.files.C.isCopy ? "Read OK — recognised as the Entry copy (has the tool tabs)" : "Read OK";
  } else if(parsed.length === 1){
    const p = parsed[0];
    let k = slot;
    if(p.isCopy){
      k = "C";
      if(S.files.C && !S.files.C.isCopy && !S.files.O){ S.files.O = S.files.C; S.status.O = "Read OK"; }
    } else if(S.files.O && S.files.O.isCopy){
      S.files.C = S.files.O; S.status.C = "Read OK — recognised as the Entry copy"; k = "O";
    } else if(S.files.C && S.files.C.isCopy){ k = "O"; }
    S.files[k] = p; S.status[k] = k !== slot ? "Read OK — moved here: this file " + (p.isCopy ? "has the entry tool tabs" : "has no entry tool tabs") : (p.isCopy ? "Read OK — recognised as the Entry copy" : "Read OK");
  }
  S.R = null; S.busy = false; render();
  if(S.files.O && S.files.C) run();
}
function setFrom(v){
  v = String(v || "").trim(); S.fromText = v; S.fromErr = "";
  if(!v){ S.fromDs = null; }
  else { const d = parseDateText(v); if(d == null){ S.fromErr = "Use DD-MM-YYYY"; S.fromDs = null; } else { S.fromDs = d; S.fromText = serialToStr(d); } }
  if(!S.fromErr){ try{ localStorage.setItem("ims-check-from", S.fromText); }catch(e){} }
}
function saveLastCheck(){
  const V = verdictOf(S.R), t = new Date();
  try{ localStorage.setItem("ims-check-last", JSON.stringify({when: serialToStr(todaySerial()) + " " + String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0"),
    real: V.realAll, newer: V.newerAll, from: S.R.fromDs != null ? serialToStr(S.R.fromDs) : ""})); }catch(e){}
}
async function run(){
  if(!S.files.O || !S.files.C) return;
  S.busy = true; render(); await new Promise(r => setTimeout(r, 30));
  const fd = $("#fromDate"); if(fd) setFrom(fd.value);
  if(S.fromErr){ S.busy = false; render(); return; }
  try{ S.R = runAll(S.files.O, S.files.C, S.fromDs); S.busy = false; saveLastCheck(); go("summary"); }
  catch(e){ S.busy = false; S.status.O = "!Compare failed: " + (e.message || e); render(); }
}
/* ---------- staff gate: uses the Production entry login (same site); no password here ---------- */
function staffSession(){
  try{ const x = JSON.parse(localStorage.getItem("ims.session") || "null"); return x && x.token && x.role === "staff" ? x : null; }
  catch(e){ return null; }
}
$("#backBtn").addEventListener("click", () => {
  if(window.opener && !window.opener.closed){ try{ window.opener.focus(); }catch(e){} window.close(); }
  setTimeout(() => { location.href = "./"; }, 300);
});
const SESS = staffSession();
if(!SESS){
  $("#app").outerHTML = `<div class="card lock"><span class="logo" aria-hidden="true"></span><h2>Open Sheet Check from Production entry</h2>
    <p class="sub" style="margin:0">Sheet Check is for staff admins. Log in to the Production entry tool, then open <b>IMS entries › Sheet check</b>.</p>
    <a class="btn primary" href="./">Go to Production entry</a></div>`;
} else {
  document.querySelector(".ver").textContent = "v" + VERSION + " · " + (SESS.name || SESS.user || "staff");
  window.addEventListener("storage", e => { if(e.key === "ims.session" && !staffSession()) location.reload(); });
  try{ const f = localStorage.getItem("ims-check-from"); if(f) setFrom(f); }catch(e){}
  if(typeof DecompressionStream === "undefined"){ S.status.O = "!This browser is too old to read .xlsx files. Use a current Chrome or Edge."; }
  render();
}
</script>
